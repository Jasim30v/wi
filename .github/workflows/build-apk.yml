def build_apk_pwa():
    """تحويل PWA إلى APK باستخدام عدة طرق"""
    print("\n" + "="*60)
    print("  📱 Building APK from PWA")
    print("="*60 + "\n")

    # طريقة 1: استخدام PWABuilder (سحابي)
    print("📦 طريقة 1: PWABuilder (سحابي)")
    print("   https://www.pwabuilder.com/")
    print("   قم برفع ملفات التطبيق أو استخدم الرابط:")
    print(f"   http://localhost:5500/{ROOT_DIR}/")

    # طريقة 2: استخدام Bubblewrap (محلي)
    print("\n📦 طريقة 2: Bubblewrap (محلي)")
    print("   npm install -g @bubblewrap/cli")
    print(f"   cd {ROOT_DIR}")
    print("   bubblewrap init")
    print("   bubblewrap build")

    # طريقة 3: استخدام PWA2APK
    print("\n📦 طريقة 3: PWA2APK (Python)")
    print("   pip install pwa2apk")
    print(f"   pwa2apk build {ROOT_DIR}/manifest.json -o {APK_NAME}.apk")

    # طريقة 4: استخدام Android Studio مع WebView (أفضل)
    print("\n📦 طريقة 4: Android Studio + WebView (موصى به)")
    print("   سيتم إنشاء مشروع Android تلقائياً")

    return True

