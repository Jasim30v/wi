def build_full_app():
    """بناء جميع ملفات التطبيق مع PWA"""
    print("\n" + "="*60)
    print("  🔥 Building WiFi Hacker Pro with PWA")
    print("="*60 + "\n")

    # إنشاء المجلد الرئيسي
    os.makedirs(ROOT_DIR, exist_ok=True)
    os.chdir(ROOT_DIR)

    # 1. ملفات HTML/CSS/JS الأساسية
    from wifi_hack_html import HTML, CSS, WIFI_JS, STORAGE_JS, PARTICLES_JS, APP_JS
    write_file("index.html", HTML)
    write_file("style.css", CSS)
    write_file("wifi_hack.js", WIFI_JS)
    write_file("storage.js", STORAGE_JS)
    write_file("particles.js", PARTICLES_JS)
    write_file("app.js", APP_JS)

    # 2. ملفات PWA
    write_file("manifest.json", json.dumps(build_manifest(), indent=2, ensure_ascii=False))
    write_file("sw.js", build_sw_js())

    # 3. أيقونات (Base64)
    icon_192 = base64.b64decode(ICON_BASE64)
    icon_512 = base64.b64decode(ICON_BASE64)
    with open("icon-192.png", "wb") as f:
        f.write(icon_192)
    with open("icon-512.png", "wb") as f:
        f.write(icon_512)
    print("  ✅ أيقونات PWA")

    print(f"\n✅ تم بناء {ROOT_DIR}/ مع 9 ملفات")
    return True

