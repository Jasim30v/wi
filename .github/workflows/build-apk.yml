    write_file(os.path.join(android_dir, "AndroidManifest.xml"), manifest)

    # MainActivity.java (WebView)
    main_activity = '''package com.wifi.hackerpro;

import android.os.Bundle;
import android.webkit.WebChromeClient;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.WebSettings;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        webView = findViewById(R.id.webView);
        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);
        settings.setDatabaseEnabled(true);
        settings.setCacheMode(WebSettings.LOAD_DEFAULT);
        
        webView.setWebChromeClient(new WebChromeClient());
        webView.setWebViewClient(new WebViewClient() {
            @Override
            public void onPageFinished(WebView view, String url) {
                super.onPageFinished(view, url);
            }
        });
        
        // تحميل الملفات المحلية
        webView.loadUrl("file:///android_asset/index.html");
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}'''
    write_file(os.path.join(android_dir, "MainActivity.java"), main_activity)

    # activity_main.xml
    layout = '''<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical">
    
    <WebView
        android:id="@+id/webView"
        android:layout_width="match_parent"
        android:layout_height="match_parent" />
</LinearLayout>'''
    write_file(os.path.join(android_dir, "activity_main.xml"), layout)

    # build.gradle
    gradle = '''plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wifi.hackerpro'
    compileSdk 34

    defaultConfig {
        applicationId "com.wifi.hackerpro"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}'''
    write_file(os.path.join(android_dir, "build.gradle"), gradle)

    print("✅ مشروع Android جاهز في: " + android_dir)
    print("📂 افتح المشروع في Android Studio")
    print("🚀 Build -> Build Bundle(s) / APK(s) -> Build APK(s)")

    return True

