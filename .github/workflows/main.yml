    os.chmod(os.path.join(PROJECT_DIR, "gradlew"), stat.S_IRWXU | stat.S_IRWXG | stat.S_IRWXO)

def main():
    print("[MAIN] بدء البناء التلقائي...")
    ensure_dirs()

    # تشغيل scraper لجلب القوائم والأدوات
    print("[MAIN] تشغيل scraper.py...")
    subprocess.run(["python3", "scraper.py"], cwd=PROJECT_DIR, check=True)

    # كتابة جميع الملفات
    write_all_files()

    # بناء APK
    apk_path = build_apk()
    print(f"[MAIN] اكتمل البناء. APK موجود في: {apk_path}")

if __name__ == "__main__":
    main()
