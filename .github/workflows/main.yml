        android:layout_height="wrap_content" android:text="هجوم Deauth" />
    <Button android:id="@+id/btn_handshake" android:layout_width="match_parent"
        android:layout_height="wrap_content" android:text="التقاط Handshake" />
    <Button android:id="@+id/btn_download" android:layout_width="match_parent"
        android:layout_height="wrap_content" android:text="تحميل قائمة كلمات المرور (10M)" />
</LinearLayout>'''
